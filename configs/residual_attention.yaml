# Residual Attention Network - no pretrained weights, 21.75 M params, needs more epochs
model: residual_attention
img_size: 128
batch_size: 64
epochs: 60
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.05
patience: 10
max_crops: 300000
val_per_class: 1500
num_workers: 4
pretrained: false
weight_power: 1.0
seed: 42
